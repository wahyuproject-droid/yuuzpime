<style>
html,body{background-color:#101010;color-scheme:dark}
#head-div {background:#151515;border-bottom:1px solid #343434}
#title1 .yuuz-brand {display:inline-block;font-family:Arial,sans-serif;font-size:clamp(25px,5vw,40px);font-weight:900;letter-spacing:-1.6px;line-height:1.2;color:#fff;text-decoration:none}
#title1 .yuuz-brand span {color:#a1a1a1}
footer {background:#181818;border-top:1px solid #343434;min-height:60px;height:auto;padding:12px 8px}
footer a,.yuuz-credit {color:#eee;font:500 12px/1.6 Arial,sans-serif}
footer .yuuz-credit a {color:#fff;text-decoration:underline}
h1,h2,.spotlight,.scontent b,.fa-closed-captioning {color:#f0f0f0}
.watch-btn,.cbox1,.sactive {background:#ededed;color:#111}
#search-div input {background:#242424;color:#fff;border-radius:6px}
#search-div button {background:#353535;color:#fff;border-radius:6px}
</style>
</head>

<body>
    <header id="head-div">
        <div id="title1">
            <a href="/"><span class="yuuz-brand">YuuZ<span>Pime</span></span></a>
        </div>
        <div id="search-div">
            <form action="/search" method='GET'>
                <input type="text" name="query" id="query" placeholder="Search Anime..." required>
                <button type="submit"><i class="fa fa-search"></i>
                </button>
            </form>
        </div>
    </header>


    <section id="vid-sec">
        <div id="vid-div">

            <div id="video">
                <iframe id="AnimeDexFrame" src="{{ iframe }}" style="border:0px #ffffff none;" scrolling="no"
                    frameborder="0" marginheight="0px" marginwidth="0px" allowfullscreen></iframe>

            </div>

        </div>

        <div id="server_main">
            <div class="status">
                <div class="scontent">
                    You are watching <b>Episode {{ title }}</b>If current server doesn't work please try other servers
                    beside.
                </div>
            </div>

            SERVER
        </div>
    </section>
    <section id="watch">
        <div class="selector link-data">
            PROSLO
        </div>
        <div class="divo">
            <h2>List Of Episodes:</h2>
            <div class="divo2">
                EPISOS
            </div>
        </div>
    </section>
    <hr>
    <footer><div class="yuuz-credit">Modifikasi oleh <strong>YuuZGilakPrompt</strong> · <a href="https://sociabuzz.com/yuuzdisini" target="_blank" rel="noopener noreferrer">SociaBuzz</a><br>Berbasis AnimeDex karya TechShreyash · MIT License</div></footer>
    <hr>
    <script>
        function selectServer(btn) {
            const buttons = document.getElementsByClassName('sobtn');
            const iframe = document.getElementById('AnimeDexFrame');
            iframe.src = btn.getAttribute('data-value');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].className = "sobtn";
            }
            btn.className = "sobtn sactive";
        };

        function showDownload() {
            document.getElementById('showdl').style.display = "none";
            document.getElementById('dldiv').classList.toggle('show');
        }
    </script>
</body>
