<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon"
        href="https://cdn.jsdelivr.net/gh/TechShreyash/AnimeDex@main/static/img/favicon.ico">
    <title>YuuZPime VideoPlayer</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style type="text/css">
        body {
            background-color: #000;
        }

        .container {
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
        }
    </style>

    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js"></script>
    <script src="https://unpkg.com/plyr@3"></script>
<style>
html,body{background-color:#101010;color-scheme:dark}
#head-div {background:#151515;border-bottom:1px solid #343434}
#title1 .yuuz-brand {display:inline-block;font-family:Arial,sans-serif;font-size:clamp(25px,5vw,40px);font-weight:900;letter-spacing:-1.6px;line-height:1.2;color:#fff;text-decoration:none}
#title1 .yuuz-brand span {color:#a1a1a1}
footer {background:#181818;border-top:1px solid #343434;min-height:60px;height:auto;padding:12px 8px}
footer a,.yuuz-credit {color:#eee;font:500 12px/1.6 Arial,sans-serif}
footer .yuuz-credit a {color:#fff;text-decoration:underline}
h1,h2,.spotlight,.scontent b,.fa-closed-captioning {color:#f0f0f0}
.watch-btn,.cbox1,.sactive {background:#ededed;color:#111}
#search-div input {background:#242424;color:#fff;border-radius:6px}
#search-div button {background:#353535;color:#fff;border-radius:6px}
</style>
</head>

<body>

    <div class="container">
        <video controls crossorigin playsinline>
            <source type="application/x-mpegURL" src="https://cors.techzbots.live/{{ m3u8 }}">
        </video>
    </div>

    <script>
        const source = 'https://cors.techzbots.live/{{ m3u8 }}';
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.querySelector("video");

            const defaultOptions = {
                title: '{{ title }}'
            };

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(source);
                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    const availableQualities = hls.levels.map((l) => l.height);

                    defaultOptions.quality = {
                        default: availableQualities[0],
                        options: availableQualities,
                        forced: true,
                        onChange: (e) => updateQuality(e),
                    };
                    const player = new Plyr(video, defaultOptions);
                });
                hls.attachMedia(video);
                window.hls = hls;
            } else {
                const player = new Plyr(video, defaultOptions);
            };

            function updateQuality(newQuality) {
                window.hls.levels.forEach((level, levelIndex) => {
                    if (level.height === newQuality) {
                        window.hls.currentLevel = levelIndex;
                    }
                });
            }
        });
    </script>
</body>

</html>
