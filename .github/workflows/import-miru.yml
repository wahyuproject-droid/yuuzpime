name: Replace source with verified Miru Web
on:
  push:
    branches: [import-miru-full]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download exact source and verify against supplied ZIP
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://codeload.github.com/LuckDay21/miru-web/zip/15dd1b636d15f7bf740a4f768463a09c10411dda' -o "$RUNNER_TEMP/miru.zip"
          python3 scripts/import_miru.py "$RUNNER_TEMP/miru.zip" "$RUNNER_TEMP/verified-miru"
      - name: Replace main source
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = 'd48296083d39b91fb6ac444faa10cf2a4ffd8be9'
          git switch -C main FETCH_HEAD
          git rm -r --ignore-unmatch .
          cp -a "$RUNNER_TEMP/verified-miru/." .
          git add -A -f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace entire EliasDex source with verified Miru Web guest edition'
          git push origin HEAD:refs/heads/main
