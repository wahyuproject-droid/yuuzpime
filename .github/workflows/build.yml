name: YuuZPime Sora - Auto Extract Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sora-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract Sora source and commit
        shell: bash
        run: |
          set -euo pipefail
          archive=YuuZPime.zip
          if [ ! -f "$archive" ]; then
            test -f remix.config.js && test -f pnpm-lock.yaml && test -d app || { echo 'Upload YuuZPime.zip to the repository root first.'; exit 1; }
            echo 'Sora source already imported.'
            exit 0
          fi
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          python3 - "$archive" "$temp" <<'PY'
          import pathlib, stat, sys, zipfile, json
          root = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(entry.filename)
                  if p.is_absolute() or '..' in p.parts or any(x in ('.git', '.github') for x in p.parts) or stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit('Unsafe ZIP entry: ' + entry.filename)
              if z.testzip() is not None:
                  raise SystemExit('Corrupt archive')
              z.extractall(root)
          for name in ('package.json', 'pnpm-lock.yaml', 'remix.config.js', 'vercel.json', 'app', 'public'):
              if not (root / name).exists():
                  raise SystemExit('Missing source: ' + name)
          pkg = json.loads((root / 'package.json').read_text())
          if pkg.get('name') != 'yuuzpime' or '@remix-run/react' not in pkg.get('dependencies', {}):
              raise SystemExit('Expected YuuZPime Sora package')
          PY
          # Remove obsolete application directories and build files, not workflow history.
          git rm -rf --ignore-unmatch -- app public src companion android api templates static routes providers docs tests tools .husky
          git rm -f --ignore-unmatch -- app.py requirements.txt runtime.txt wsgi.py next.config.js next.config.mjs next.config.ts next-env.d.ts package-lock.json yarn.lock bun.lock bun.lockb Dockerfile docker-compose.yml components.json eslint.config.mjs postcss.config.mjs tailwind.config.ts LICENSE
          cp -a "$temp/." .
          git rm -f -- "$archive"
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Import YuuZPime Sora web source'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          test -f pnpm-lock.yaml
          test -f remix.config.js
          echo 'Sora web source imported. Deploy the new commit in Vercel.'
