name: YuuZPime Guest Mode
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guest-mode.yml'
permissions:
  contents: write
jobs:
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guest mode without changing providers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          
          root = Path.cwd()
          assert (root / 'app/services/supabase/index.ts').is_file(), 'Source Sora not found'
          
          def write(path, value):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(value, encoding='utf-8')
          
          def edit(path, old, new):
              p = root / path
              value = p.read_text(encoding='utf-8')
              if old in value:
                  p.write_text(value.replace(old, new, 1), encoding='utf-8')
              elif new not in value:
                  raise RuntimeError(f'Unexpected source: {path}')
          
          # No database client is imported or initialized in guest-only mode.
          write('app/services/supabase/index.ts', '''export * from './guest.server';
          export * from './cookie.server';
          export type { Database, IHistory, IHistoryDTO } from './table.server';
          ''')
          write('app/services/supabase/guest.server.ts', '''import type { User } from '@supabase/supabase-js';
          import isbot from 'isbot';
          import type { IHistory, IHistoryDTO } from './table.server';
          
          export async function getUserFromCookie(_cookie: string): Promise<User | undefined> {
            return undefined;
          }
          
          export async function authenticate(
            request: Request,
            _customAuthRequired?: boolean,
            botcheckRequired?: boolean,
            _payloadCheckRequired?: boolean,
            _headers = new Headers(),
          ): Promise<User | undefined> {
            const check = isbot.spawn();
            check.exclude(['Checkly', 'chrome-lighthouse', 'googlebot', 'bingbot', 'discordbot', 'twitterbot', 'vercel']);
            if (botcheckRequired && check(request.headers.get('User-Agent'))) {
              throw new Response('Forbidden', { status: 403 });
            }
            return undefined;
          }
          
          export async function insertHistory(_history: IHistoryDTO) {
            return { data: null as IHistory[] | null, error: new Error('Account history is disabled in guest mode') };
          }
          export async function getHistory(_userId: string, _types: string | null, _from: string | null, _to: string | null, _page = 1): Promise<IHistory[]> {
            return [];
          }
          export async function getCountHistory(_userId: string, _types: string | null, _from: string | null, _to: string | null): Promise<number> {
            return 0;
          }
          ''')
          # Disable account screens and never assign a fabricated user or administrator.
          for route in ('sign-in', 'sign-up', 'sign-out'):
              write(f'app/routes/_auth+/{route}.tsx', '''import { redirect } from '@remix-run/node';
          export const loader = () => redirect('/');
          export const action = () => redirect('/');
          export default function GuestRedirect() { return null; }
          ''')
          for route in ('cache.tsx', 'cache_.$cacheKey.ts'):
              write(f'app/routes/admin+/{route}', '''export const loader = () => { throw new Response('Forbidden', { status: 403 }); };
          export const action = () => { throw new Response('Forbidden', { status: 403 }); };
          ''' + ('export default function DisabledAdmin() { return null; }\n' if route.endswith('.tsx') else ''))
          edit('app/services/configs.server.ts', "__invitedSignUpOnly: env.INVITED_SIGNUP_ONLY === 'ON',", '__invitedSignUpOnly: false,')
          edit('app/services/configs.server.ts', "__globalAuthRequired: env.GLOBAL_AUTH_REQUIRED === 'ON',", '__globalAuthRequired: false,')
          edit('app/components/layouts/MultiLevelDropdown.tsx', "title: user ? username : t('sign-in'),\n        isTitleClickable: true,\n        titleAction: () => (user ? null : navigate(`/sign-in?ref=${ref}`)),", "title: user ? username : 'Guest',\n        isTitleClickable: false,\n        titleAction: () => null,")
          edit('app/components/layouts/MultiLevelDropdown.tsx', "          {\n            id: 'sign-up-log-out',\n            title: user ? t('log-out') : t('sign-up'),\n            description: user ? 'Log out of your account' : 'Sign up for an account',\n            showIcon: false,\n            icon: null,\n            action: () => navigate(user ? `/sign-out?ref=${ref}` : `/sign-up?ref=${ref}`),\n          },", "          {\n            id: 'guest-mode',\n            title: 'Guest mode',\n            description: 'No account required',\n            showIcon: false,\n            icon: null,\n            action: () => null,\n          },")
          edit('app/components/layouts/BottomNav.tsx', "    ...(user\n      ? [\n          {\n            name: 'logout',\n            icon: LogOut,\n            path: `/sign-out?ref=${ref}`,\n          },\n        ]\n      : [\n          {\n            name: 'login',\n            icon: LogIn,\n            path: `/sign-in?ref=${ref}`,\n          },\n        ]),", "    // Guest mode: no account action.")
          edit('app/components/layouts/BottomNav.tsx', "import { NavLink, useLocation, useSearchParams } from '@remix-run/react';", "import { NavLink } from '@remix-run/react';")
          for line in ("import LogIn from '~/assets/icons/LogInIcon';\n", "import LogOut from '~/assets/icons/LogOutIcon';\n", "  const { user } = props;\n", "  const location = useLocation();\n", "  const [search] = useSearchParams();\n", "  const ref = (search.get('ref') || location.pathname + location.search)\n    .replace('?', '_0x3F_')\n    .replace('&', '_0x26');\n"):
              path = root / 'app/components/layouts/BottomNav.tsx'
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(line, '', 1), encoding='utf-8')
          edit('app/components/layouts/BottomNav.tsx', 'const BottomNav = (props: IBottomNavProps)', 'const BottomNav = (_props: IBottomNavProps)')
          edit('app/routes/watch-history.tsx', '<h2>Your watch history</h2>', '<h2>Your watch history</h2>\n      <p className="text-default-500">Guest mode: account watch history is unavailable.</p>')
          print('Guest mode patch applied')
          PYTHON
      - name: Save source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if git diff --cached --quiet; then
            echo 'Guest mode already applied'
          else
            git commit -m 'Enable YuuZPime guest mode without Supabase'
            git push origin HEAD:main
          fi
          
