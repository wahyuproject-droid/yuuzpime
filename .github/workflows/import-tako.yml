name: Build YuuZPime APK
on:
  push:
    branches: [main]
    paths: ['lib/**', 'android/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/import-tako.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yuuzpime-build
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Gradle wrapper
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create --platforms=android --project-name wrapper_template "$RUNNER_TEMP/wrapper_template"
            mkdir -p android/gradle/wrapper
            cp "$RUNNER_TEMP/wrapper_template/android/gradlew" android/gradlew
            cp "$RUNNER_TEMP/wrapper_template/android/gradlew.bat" android/gradlew.bat
            cp "$RUNNER_TEMP/wrapper_template/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          fi
          chmod +x android/gradlew
      - run: flutter pub get
      - name: Build test APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk YuuZPime-debug.apk
          sha256sum YuuZPime-debug.apk > YuuZPime-debug.apk.sha256
          sed -n 's/^version: \([0-9.]*\)+.*$/yuuzpime-tako-v\1/p' pubspec.yaml > release-tag.txt
          test -s release-tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YuuZPime-APK
          path: |
            YuuZPime-debug.apk
            YuuZPime-debug.apk.sha256
            release-tag.txt
          if-no-files-found: error
  publish:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YuuZPime-APK
      - name: Publish versioned test APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REV: ${{ github.sha }}
        run: |
          TAG=$(cat release-tag.txt)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Version already published. Increment pubspec version and Dart version for another update."
          else
            gh release create "$TAG" YuuZPime-debug.apk YuuZPime-debug.apk.sha256 --repo "$REPO" --target "$REV" --title "YuuZPime ${TAG#yuuzpime-tako-}" --notes "Noncommercial debug APK; test build only. Original TakoPlay attribution and license retained. Debug signatures may differ between builds; in-place upgrade requires a persistent signing key." --prerelease
          fi
