name: Build bundled Kitsune Android APK
on:
  push:
    branches: [android-kitsune-bundle]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yuuzpime-miru-bundle-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify original source and build bundled React UI
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://codeload.github.com/dovakiin0/Kitsune/zip/c7fa855304c3c198f9b9a366e5006989d0535fad' -o "$RUNNER_TEMP/kitsune.zip"
          python3 mobile/prepare.py "$RUNNER_TEMP/kitsune.zip" "$RUNNER_TEMP/miru"
          cd "$RUNNER_TEMP/miru"
          npm install --no-audit --no-fund
          npm run build
          cd "$GITHUB_WORKSPACE"
          mkdir -p android/assets/miru
          cp -a "$RUNNER_TEMP/miru/dist/." android/assets/miru/
          test -s android/assets/miru/index.html
          du -sh android/assets/miru
      - name: Compile and sign Android APK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p build/generated build/classes build/dex dist
          "$BT/aapt2" compile --dir android/res -o build/resources.zip
          "$BT/aapt2" link -I "$JAR" --manifest android/AndroidManifest.xml --java build/generated -A android/assets -o build/base.apk build/resources.zip
          find android/java build/generated -name '*.java' -print0 | xargs -0 javac -source 8 -target 8 -classpath "$JAR" -d build/classes
          jar cf build/classes.jar -C build/classes .
          "$BT/d8" --lib "$JAR" --min-api 23 --output build/dex build/classes.jar
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk
          KEY="$RUNNER_TEMP/yuuzpime-signing.jks"
          keytool -genkeypair -keystore "$KEY" -storepass android -keypass android -alias yuuzpime -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YuuZPime Test Build,O=YuuZGilakPrompt"
          "$BT/apksigner" sign --ks "$KEY" --ks-pass pass:android --key-pass pass:android --ks-key-alias yuuzpime --out dist/YuuZPime.apk build/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs dist/YuuZPime.apk
          "$BT/aapt" dump badging dist/YuuZPime.apk
          sha256sum dist/YuuZPime.apk > dist/YuuZPime.apk.sha256
      - name: Package complete source for editing
        run: |
          set -euo pipefail
          mkdir -p dist/source-project/kitsune-original
          unzip -q "$RUNNER_TEMP/kitsune.zip" -d dist/source-project/kitsune-original
          cp -a mobile android dist/source-project/
          rm -rf dist/source-project/android/assets
          mkdir -p dist/source-project/.github/workflows
          cp .github/workflows/android-apk.yml dist/source-project/.github/workflows/
          cp "$RUNNER_TEMP/kitsune.zip" dist/source-project/Kitsune-master.zip
          (cd dist/source-project && zip -q -r ../YuuZPime-full-source.zip .)
          unzip -tq dist/YuuZPime-full-source.zip
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="kitsune-v4.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/YuuZPime.apk dist/YuuZPime.apk.sha256 dist/YuuZPime-full-source.zip --target "$GITHUB_SHA" --title "YuuZPime Android $TAG" --notes "Kitsune original detail layout and UI components, browser-adapted AniList catalog and ArtPlayer for authorized local or HTTPS media. Includes full verified 214-file original source ZIP and Android build adapters. No login or Vercel dependency. Unverified external streaming and Companion are not enabled. Temporary signing key."
